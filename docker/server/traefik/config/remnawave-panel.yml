http:
  routers:
    remnawave:
      rule: 'Host(`{{ env "REMNAWAVE_DOMAIN" }}`)'
      entrypoints:
        - https
      tls:
        certResolver: letsencrypt
      service: remnawave

  middlewares:
    remnawave-https-redirect:
      redirectScheme:
        scheme: https

  services:
    remnawave:
      loadBalancer:
        servers:
          - url: "http://remnawave:3000"